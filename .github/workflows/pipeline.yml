name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

env:
  PIXI_VERSION: v0.81.0

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: psf/black@stable
      with:
        options: "--check --diff"
        src: ./src/${{ github.event.repository.name }}

  black_fix:  # in most cases pre-commit is faster
    needs: [black]
    if: failure()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.DEPENDABOT_WORKFLOW_TOKEN }}
        ref: ${{ github.event.pull_request.head.ref }} # Check out the head of the actual branch, not the PR
        fetch-depth: 0 # otherwise, you will fail to push refs to dest repo
    - name: format black
      uses: psf/black@stable
      with:
        options: ""
        src: "./src/${{ github.event.repository.name }}"
    - name: commit
      run: |
        git config --local user.email "pyiron@mpie.de"
        git config --local user.name "pyiron-runner"
        git commit -m "Format black" -a
    - name: push
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.DEPENDABOT_WORKFLOW_TOKEN }}
        branch: ${{ github.event.pull_request.head.ref }}

  mypy:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mypy
        run: pip install mypy
      - name: Test
        run: mypy --ignore-missing-imports src/${{ github.event.repository.name }}

  # Validates that pyproject.toml's published dependency range is
  # satisfiable by pip/uv from PyPI alone (independent of the conda-forge
  # resolution pixi uses), and that the built package is pip-check clean.
  pip_check:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: ${{ env.PIXI_VERSION }}
        cache: true
        environments: dev
        locked: true
    - name: pip check
      run: pixi run -e dev pip check

  # Fails if pyproject.toml's dependency bounds don't match what the
  # validated `lower`/`upper` Pixi environments actually resolved - see
  # docs/dependency_policy.md.
  bounds_check:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: ${{ env.PIXI_VERSION }}
        cache: true
        environments: lower upper-py311 upper-py312 upper-py313 upper-py314 dev
        locked: true
    - name: Check dependency bounds
      run: pixi run check-bounds

  uv_check:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v7
    - name: Install the project and pip check
      shell: bash -l {0}
      run: |
        uv sync --all-extras --dev
        pip check

  minimal:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: ${{ env.PIXI_VERSION }}
        cache: true
        environments: mini
        locked: true
    - name: Test
      run: pixi run -e mini test

  unittest_matrix:
    needs: [black]
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        include:
        - operating-system: macos-latest
          environment: upper-py314
          label: osx-64-py-3-14

        - operating-system: ubuntu-24.04-arm
          environment: upper-py314
          label: linux-arm-24-py-3-14

        - operating-system: ubuntu-22.04-arm
          environment: upper-py314
          label: linux-arm-22-py-3-14

        - operating-system: windows-latest
          environment: upper-py314
          label: win-64-py-3-14

        - operating-system: ubuntu-latest
          environment: upper-py314
          label: linux-64-py-3-14

        - operating-system: ubuntu-latest
          environment: upper-py313
          label: linux-64-py-3-13

        - operating-system: ubuntu-latest
          environment: upper-py312
          label: linux-64-py-3-12

        - operating-system: ubuntu-latest
          environment: upper-py311
          label: linux-64-py-3-11

    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: ${{ env.PIXI_VERSION }}
        cache: true
        environments: ${{ matrix.environment }}
        locked: true
    - name: Test
      run: pixi run -e ${{ matrix.environment }} test
    - name: Upload coverage reports to Codecov
      if: matrix.label == 'linux-64-py-3-12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  # oldest supported dependency versions - see docs/dependency_policy.md
  unittest_lower:
    needs: [black]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: ${{ env.PIXI_VERSION }}
        cache: true
        environments: lower
        locked: true
    - name: Test
      run: pixi run -e lower test

  autobot:
    needs: [uv_check, unittest_lower, unittest_matrix, pip_check, bounds_check, mypy, minimal]
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: (github.event.pull_request.user.login == 'pre-commit-ci[bot]')
    steps:
      - name: Enable auto-merge for bot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
