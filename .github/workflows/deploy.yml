# This workflow is used to upload and deploy a new release to PyPi
# Based on https://github.com/pypa/gh-action-pypi-publish

name: PyPi Release

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
  build:
    if: startsWith(github.event.ref, 'refs/tags') || github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ github.event.repository.name }}
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.81.0
        cache: true
        environments: lower upper-py311 upper-py312 upper-py313 upper-py314 dev
        locked: true
    - name: Generate dependency bounds from the validated lower/upper environments
      # Fails the release if a direct dependency is missing from lower/upper,
      # lower > upper, or the upper environments disagree on a version - see
      # .ci_support/pyproject_bounds.py and docs/dependency_policy.md. This
      # never touches pixi.lock, only pyproject.toml's published ranges.
      run: |
        pixi run generate-bounds
        cat pyproject.toml
        git update-index --assume-unchanged pyproject.toml src/pyfileindex/_version.py
    - name: Build
      run: pixi run -e dev hatchling build -t sdist -t wheel
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
